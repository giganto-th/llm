# =========================================================
# LiteLLM Proxy config
# docs: https://docs.litellm.ai/docs/proxy/configs
# =========================================================

model_list:
  # ── Gemma 4 31B QAT (llama.cpp backend, alias -a gemma-4-31b) ──
  - model_name: gemma-4-31b
    litellm_params:
      # openai/<name>: บอก LiteLLM ให้ยิงเป็น OpenAI-compat protocol
      model: openai/gemma-4-31b
      api_base: http://llama:8000/v1
      api_key: os.environ/VLLM_API_KEY
      # nominal cost — self-hosted ไม่มีค่าใช้จ่ายจริง
      # แต่ต้องมี cost > 0 เพื่อให้ budget quota คำนวณได้
      # ตั้งไว้ $1 / 1M tokens → max_budget 5 = 5M tokens
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

  # ── no-reasoning variant (สำหรับ external API/key) ──
  # ปิด thinking ของ Gemma → ตอบสั้น/เร็ว ไม่มี reasoning_content
  # OWUI ไม่ได้ใช้ชื่อนี้ → ฝั่ง OWUI ยังคิดปกติ ไม่ถูกกระทบ
  # extra_body ส่งผ่านตรงไป llama.cpp (ไม่โดน drop_params ตัด)
  - model_name: gemma-4-31b-fast
    litellm_params:
      model: openai/gemma-4-31b
      api_base: http://llama:8000/v1
      api_key: os.environ/VLLM_API_KEY
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

litellm_settings:
  # ตัด param ที่ backend ไม่รู้จัก แทนที่จะ error
  drop_params: true
  # ปิด telemetry ไปหา LiteLLM
  telemetry: false
  # cache ระดับ prompt (redis optional — ปิดไว้ก่อน)
  # cache: true
  # cache_params:
  #   type: local
  # ── default limits (fallback ถ้า key ไม่มี override) ──
  request_timeout: 600
  # max tokens ต่อ 1 request (กันขอ 200k tokens แล้ว hang GPU)
  max_input_tokens: 30000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # เก็บ model config ใน DB → เพิ่ม/แก้ผ่าน UI ได้โดยไม่ต้อง restart
  store_model_in_db: true
  # UI: /ui — login ด้วย UI_USERNAME / UI_PASSWORD
  ui_access_mode: "admin_only"
  # เปิดตอน debug quota:
  # allow_user_auth: true
  # spend log ต่อ request — จำเป็นสำหรับ budget tracking
  disable_spend_logs: false
  # อายุ log สูงสุด 90 วัน
  maximum_spend_logs_retention_period: "90d"
