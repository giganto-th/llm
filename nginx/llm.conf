# =========================================================
# HTTP (:80) — ACME challenge + redirect ทุกอย่างไป HTTPS
# =========================================================
server {
    listen 80;
    server_name llm.example.com;

    # Let's Encrypt renewal (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ที่เหลือทั้งหมด → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================
# HTTPS (:443) — main config
# =========================================================
server {
    listen 443 ssl http2;
    server_name llm.example.com;

    # ─────────────────────────────────────────────────
    # SSL certificate จาก Let's Encrypt (ผ่าน certbot)
    # ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;

    # ค่า TLS มาตรฐานที่ certbot generate ให้ (Mozilla intermediate)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — บังคับ browser ใช้ HTTPS 2 ปี
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ─────────────────────────────────────────────────
    # จำกัดขนาด upload — ครอบทุก location
    # เผื่อแนบภาพ 4K จากมือถือ (15-25MB) + PDF หลายหน้า
    # ─────────────────────────────────────────────────
    client_max_body_size 50M;

    # =========================
    # WebUI (OpenWebUI)
    # =========================
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================
    # LiteLLM Proxy (OpenAI API) — port 4000
    # auth ผ่าน virtual key ของแต่ละ team (Admin/User/Guest)
    # client ต้องส่ง: Authorization: Bearer <team-virtual-key>
    # (หรือ master key สำหรับ admin — ไม่แนะนำเปิดสาธารณะ)
    #
    # LiteLLM enforces: rate limit (TPM/RPM) + budget quota ต่อ team
    # แล้ว proxy ต่อไป llama.cpp (Gemma 4 31B QAT + MTP)
    # =========================
    location /v1/ {
        proxy_pass http://127.0.0.1:4000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ส่ง Authorization header ต่อไปให้ LiteLLM ตรวจสอบ virtual key
        proxy_set_header Authorization $http_authorization;

        # สำคัญมากสำหรับ streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # กัน timeout ตอน generate ยาว
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # ปิด buffer (สำคัญกับ LLM streaming)
        proxy_buffering off;
    }

    # =========================
    # LiteLLM Admin UI + API — /litellm/  (LiteLLM ตั้ง SERVER_ROOT_PATH=/litellm)
    # จัดการ teams / keys / budgets / spend logs
    # (login ด้วย UI_USERNAME / UI_PASSWORD ที่ตั้งใน .env)
    #
    # สำคัญ: proxy_pass ต้อง "ไม่มี" trailing slash — ให้ nginx ส่ง path เต็ม
    # /litellm/... ไปตรงๆ (ตรงกับ SERVER_ROOT_PATH). ถ้าใส่ / จะ strip prefix
    # แล้ว backend หา route ไม่เจอ (UI เสิร์ฟที่ /litellm/ui/ ไม่ใช่ /ui/)
    # =========================
    location /litellm/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # เผื่อ spend-logs / generate ที่ใช้เวลานาน
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
